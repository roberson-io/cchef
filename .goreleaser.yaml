# GoReleaser configuration for cchef.
# Build locally with:  goreleaser release --snapshot --clean
# A real release is cut by the tag-triggered workflow in .github/workflows/.
version: 2

project_name: cchef

before:
  hooks:
    - go mod tidy
    - go mod verify
    # Generate shell completions from the built-in cobra command so the
    # packages and archives can ship them.
    - mkdir -p completions
    - sh -c 'go run . completion bash > completions/cchef.bash'
    - sh -c 'go run . completion zsh > completions/_cchef'
    - sh -c 'go run . completion fish > completions/cchef.fish'
    # PowerShell has no system-wide completion directory to install into, so it
    # ships in the archives (where the Windows zip picks it up) rather than in
    # the deb/rpm.
    - sh -c 'go run . completion powershell > completions/cchef.ps1'

builds:
  - id: cchef
    main: .
    binary: cchef
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/roberson-io/cchef/cmd.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: cchef
    ids: [cchef]
    # tar.gz everywhere, zip on Windows.
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - CHANGELOG.md
      - LICENSE
      - NOTICE
      - SECURITY.md
      - src: docs/*
        dst: docs/
      - src: man/cchef.1
        dst: man/cchef.1
      - src: completions/*
        dst: completions/

# One CycloneDX SBOM per archive, published alongside it.
sboms:
  - id: archive
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.cyclonedx.sbom.json"
    cmd: cyclonedx-gomod
    args: ["app", "-json", "-output", "$document", "-main", ".", "../"]

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Keyless Sigstore signing of the checksums file (verifiable with `cosign
# verify-blob` against the release's OIDC identity).
signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

nfpms:
  - id: packages
    package_name: cchef
    vendor: Michael Roberson
    homepage: https://github.com/roberson-io/cchef
    maintainer: Michael Roberson <noreply@github.com>
    description: |-
      CyberChef on the command line.
      A Go port of the data-transformation engine of CyberChef: every operation
      is a subcommand that reads input and writes output.
    license: Apache-2.0
    formats: [deb, rpm]
    bindir: /usr/bin
    section: utils
    contents:
      - src: man/cchef.1
        dst: /usr/share/man/man1/cchef.1
      - src: completions/cchef.bash
        dst: /usr/share/bash-completion/completions/cchef
      - src: completions/_cchef
        dst: /usr/share/zsh/site-functions/_cchef
      - src: completions/cchef.fish
        dst: /usr/share/fish/vendor_completions.d/cchef.fish
      - src: LICENSE
        dst: /usr/share/doc/cchef/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/cchef/NOTICE
    # Optical Character Recognition drives an installed tesseract. The package
    # is named differently per distribution — tesseract-ocr on Debian and
    # Ubuntu, tesseract on Fedora and RHEL — so naming one for both formats
    # would recommend a package that does not exist on the other. It is a weak
    # dependency, so the wrong name fails silently rather than loudly.
    overrides:
      deb:
        recommends:
          - tesseract-ocr
      rpm:
        recommends:
          - tesseract

homebrew_casks:
  - name: cchef
    ids: [cchef]
    repository:
      owner: roberson-io
      name: homebrew-tap
      # Cross-repo push needs the tap PAT; without this GoReleaser falls back to
      # the Actions GITHUB_TOKEN, which cannot write to another repository.
      # GoReleaser requires this to be exactly {{ .Env.VAR }}.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/roberson-io/cchef
    description: CyberChef on the command line
    license: Apache-2.0
    binaries:
      - cchef
    manpages:
      - man/cchef.1
    completions:
      bash: completions/cchef.bash
      zsh: completions/_cchef
      fish: completions/cchef.fish
    # Only push the cask when a tap token is present, so the first release can
    # ship archives/packages/signatures without the tap being set up yet.
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    # A downloaded binary is quarantined on macOS; clear the attribute on
    # install so it runs without a Gatekeeper prompt.
    hooks:
      post:
        install: |
          if OS.mac? && File.exist?("#{staged_path}/cchef")
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/cchef"]
          end

scoops:
  - name: cchef
    ids: [cchef]
    repository:
      owner: roberson-io
      name: scoop-bucket
      # Cross-repo push needs a PAT, for the same reason the tap does; the
      # Actions GITHUB_TOKEN cannot write to another repository. GoReleaser
      # requires this to be exactly {{ .Env.VAR }}.
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    homepage: https://github.com/roberson-io/cchef
    description: CyberChef on the command line
    license: Apache-2.0
    # Only push the manifest when a bucket token is present, so a release can
    # ship everything else without the bucket being set up yet.
    skip_upload: '{{ if index .Env "SCOOP_BUCKET_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'

release:
  github:
    owner: roberson-io
    name: cchef
  draft: true
  footer: >-
    **Installing and verifying this release:** see the
    [install guide](https://github.com/roberson-io/cchef/blob/{{ .Tag }}/docs/install.md),
    including
    [Verifying a release](https://github.com/roberson-io/cchef/blob/{{ .Tag }}/docs/install.md#verifying-a-release).

changelog:
  disable: true

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"
